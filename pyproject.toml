[project]
name = "brats-jepa"
version = "0.1.0"
description = "Self-Supervised Representation Learning on 2D BraTS Glioma MRI: Comparing I-JEPA, SigReg JEPA, VisReg JEPA, and UNet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "monai>=1.3.0",
    "nibabel>=4.0.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
